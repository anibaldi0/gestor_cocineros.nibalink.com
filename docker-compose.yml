services:
  db:
    image: postgres:15-alpine
    container_name: gestion_cocina_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: gestion_cocina_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
    container_name: gestion_cocina_frontend
    restart: unless-stopped
    networks:
      - internal

  reverse-proxy:
    profiles: ["prod"]
    image: nginx:1.27-alpine
    container_name: gestion_cocina_reverse_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

volumes:
  db_data:
    name: gestion_cocina_db_data

networks:
  internal:
    name: gestion_cocina_internal
    driver: bridge
